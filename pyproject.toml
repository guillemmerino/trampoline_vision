# Eines que pip necessita per construir la wheel; no són dependències d’anàlisi.
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

# Metadades del paquet instal·lable. El nucli actual usa només biblioteca estàndard Python.
[project]
name = "trampoline-vision"
dynamic = ["version"]
description = "Modular 2D video analysis for trampoline gymnastics"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

# Dibuix i codificació opcionals. El nucli i inspect no importen aquestes eines.
# PyAV 16 manté compatibilitat amb Python 3.10/3.11 del projecte i del contenidor.
[project.optional-dependencies]
visualization = ["av>=16,<17", "Pillow>=11,<14"]
# Backend OC-SORT opcional; la versió fixa l'API comprovada, sense detectors ni pesos.
# Les dependències transitives encara no constitueixen un lock de desplegament.
tracking = ["trackers==2.6.1"]
# BoT-SORT i extracció OSNet opcionals. Docker fixa també les wheels CPU de PyTorch.
tracking-reid = ["boxmot==16.0.9", "torch==2.5.1", "torchvision==0.20.1", "av>=16,<17"]

# Relaciona la comanda de terminal amb la funció main de la CLI.
[project.scripts]
trampoline-vision = "trampoline_vision.interfaces.cli.main:main"

# Busca paquets sota src/ perquè tests i experiments no s’instal·lin accidentalment.
[tool.setuptools.packages.find]
where = ["src"]

# Llegeix la versió del paquet per no mantenir dos números diferents.
[tool.setuptools.dynamic]
version = {attr = "trampoline_vision.__version__"}
